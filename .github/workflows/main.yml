name: main
on:
  push:
    branches: ['main']
    tags: ['*']

env:
  IMAGE_NAME: bmltenabled/bmlt-server:latest

jobs:
  test-php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        db:
          - "mariadb:10.2"
          - "mariadb:latest"
          - "mysql:8.4"
    services:
      db:
        image: ${{ matrix.db }}
        ports:
          - 3306
        env:
          MYSQL_USER: rootserver
          MYSQL_PASSWORD: rootserver
          MYSQL_DATABASE: rootserver
          MYSQL_ROOT_PASSWORD: rootserver
        options: --health-cmd="${{ (matrix.db == 'mariadb:latest') && 'mariadb-admin' || 'mysqladmin' }} ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - name: checkout 🛒
        uses: actions/checkout@v6

      - name: php ${{ matrix.php }} 🐘
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2.8.12

      - name: make composer 🎼
        run: |
          DEV=1 make composer

      - name: make lint 🧹
        run: |
          make lint

      - name: make timezone 🕐
        run: |
          make timezone

      - name: make test 🧪
        env:
          DB_PORT: ${{ job.services.db.ports[3306] }}
        run: |
          make test

      - name: Send coverage data to codecov.io 📀
        if: matrix.db == 'mariadb:latest' && matrix.php == '8.4'
        uses: codecov/codecov-action@v5
        with:
          files: src/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  test-js:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout 🛒
        uses: actions/checkout@v6

      - name: node 22 ❇️
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: make npm ♦️
        run: |
          make npm

      - name: make lint-js 🧹
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: |
          make lint-js

      - name: make test-js 🧪
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: |
          make test-js

  build:
    runs-on: ubuntu-24.04
    needs: [test-php, test-js]
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout 🛒
        uses: actions/checkout@v6

      - name: php 8.3 🐘
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2.9.5

      - name: make composer 🎼
        run: |
          make composer

      - name: setup node 22 ❇️
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: make frontend 🐥
        run: |
          make frontend

      - name: Write .env with APP_VERSION and COMMIT_SHA 🧃
        shell: bash
        run: |
          echo COMMIT_SHA=${GITHUB_SHA} > src/.env
          if [[ $GITHUB_REF_NAME =~ ^([0-9]+\.){2}(\*|[0-9]+)(-.*)?$ ]]; then
            echo APP_VERSION=${GITHUB_REF_NAME} >> src/.env
          fi

      - name: make zip 🗜
        run: |
          make zip

      - name: Configure S3 AWS Credentials 🪪
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions/gh-ci-s3-artifact
          role-session-name: gh-actions
          aws-region: us-east-1

      - name: Copy Artifacts to S3 🪣
        run: |
          aws s3 cp build/bmlt-server.zip s3://${{ secrets.S3_BUCKET }}/bmlt-server/bmlt-server-$(cat src/config/app.php | grep "'version'" | cut -d"'" -f6)-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.zip

      - name: Configure AWS Credentials 🪪
        if: contains(github.ref_name, 'main') || contains(github.ref_name, 'unstable')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions/gh-ci-tf-bmlt-rs
          role-session-name: gh-actions-bmlt
          aws-region: us-east-1

      - name: Set up QEMU 🖥
        if: contains(github.ref_name, 'main') || contains(github.ref_name, 'unstable')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx 🛠
        if: contains(github.ref_name, 'main') || contains(github.ref_name, 'unstable')
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub 🎫
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: make docker-push 🐋
        if: contains(github.ref_name, 'main') || contains(github.ref_name, 'unstable')
        id: docker_push_images
        run: |
          make docker-push

      - name: Generate Release Notes 📝
        if: github.ref_type == 'tag'
        run: |
          curl -LO https://raw.githubusercontent.com/bmlt-enabled/release-notes-tool/main/gh-release-notes.sh
          chmod +x gh-release-notes.sh
          ./gh-release-notes.sh CHANGELOG.md "##"
          RELEASE_TYPE=$(if [[ "$GITHUB_REF_NAME" =~ -(beta|rc) ]]; then echo "true"; else echo "false"; fi)
          echo "RELEASE_TYPE=${RELEASE_TYPE}" >> $GITHUB_ENV

      - name: Create Release 🎉
        uses: ncipollo/release-action@v1
        if: github.ref_type == 'tag'
        with:
          artifacts: "build/bmlt-server.zip"
          bodyFile: "changelog.txt"
          prerelease: ${{ env.RELEASE_TYPE }}

  deploy:
    runs-on: ubuntu-24.04
    concurrency: deploy-${{ matrix.env }}
    needs: [build]
    permissions:
      id-token: write
      contents: write
    if: contains(github.ref_name, 'main')
    strategy:
      fail-fast: false
      matrix:
        env:
          - "latest"
          - "unstable"
    steps:
      - name: Checkout 🛒
        uses: actions/checkout@v6

      - name: Configure AWS Credentials 🪪
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions/gh-ci-tf-bmlt-rs
          role-session-name: gh-actions-bmlt
          aws-region: us-east-1

      - name: Update ECS Service bmlt-${{ matrix.env }} ⛴
        run: |
          aws ecs update-service --cluster bmlt --service bmlt-${{ matrix.env }} --force-new-deployment
          aws ecs wait services-stable --cluster bmlt --services bmlt-${{ matrix.env }}
