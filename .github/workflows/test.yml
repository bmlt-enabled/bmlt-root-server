name: test
on:
  push:
    branches-ignore: ['main']

jobs:
  test-php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        db:
          - "mariadb:10.2"
          - "mariadb:latest"
          - "mysql:8.4"
    services:
      db:
        image: ${{ matrix.db }}
        ports:
          - 3306
        env:
          MYSQL_USER: rootserver
          MYSQL_PASSWORD: rootserver
          MYSQL_DATABASE: rootserver
          MYSQL_ROOT_PASSWORD: rootserver
        options: --health-cmd="${{ (matrix.db == 'mariadb:latest') && 'mariadb-admin' || 'mysqladmin' }} ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - name: checkout 🛒
        uses: actions/checkout@v6

      - name: php ${{ matrix.php }} 🐘
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2.6.5

      - name: make composer 🎼
        run: |
          DEV=1 make composer

      - name: make lint 🧹
        run: |
          make lint

      # sort_results_by_next_start uses CONVERT_TZ with IANA zone names, which needs
      # the server's timezone tables. Normal installs and RDS have them; the bare CI
      # service container does not. mysql_tzinfo_to_sql emits the `Offset` column
      # unquoted, which MariaDB rejects as a reserved word, so quote it — valid on
      # both engines.
      - name: load timezone tables 🕐
        env:
          DB_PORT: ${{ job.services.db.ports[3306] }}
        run: |
          mysql_tzinfo_to_sql /usr/share/zoneinfo \
            | sed 's/, Offset,/, `Offset`,/g' \
            | mysql -h 127.0.0.1 -P "$DB_PORT" -u root -prootserver mysql

      - name: make timezone 🕐
        run: |
          make timezone

      - name: make test 🧪
        env:
          DB_PORT: ${{ job.services.db.ports[3306] }}
        run: |
          make test

  test-js:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout 🛒
        uses: actions/checkout@v6

      - name: node 22 ❇️
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: make npm ♦️
        run: |
          make npm

      - name: make lint-js 🧹
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: |
          make lint-js

      - name: make test-js 🧪
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: |
          make test-js
